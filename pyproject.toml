[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "philiprehberger-data-pipeline"
version = "0.2.0"
description = "Composable data transformation pipeline with lazy evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Philip Rehberger" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/philiprehberger/py-data-pipeline#readme"
Repository = "https://github.com/philiprehberger/py-data-pipeline"
Issues = "https://github.com/philiprehberger/py-data-pipeline/issues"
Changelog = "https://github.com/philiprehberger/py-data-pipeline/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/philiprehberger_data_pipeline"]
